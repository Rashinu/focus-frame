<section id="signup" class="signup-section">
    <div class="container signup-container">
        <div class="signup-content">
            <h2 class="heading-lg mb-md">Sign <span class="text-accent">Up</span></h2>
            <p class="signup-desc mb-lg">Please use the form below to contact us. Enter your name, email, and
                message and we'll get back to you shortly.</p>

            <form class="signup-form">
                <input type="text" placeholder="Enter your name" class="input-field mb-sm">
                <input type="email" placeholder="Enter your email" class="input-field mb-sm">
                <textarea placeholder="Message" class="input-field message-field mb-lg"></textarea>
                <button type="submit" class="btn btn-primary btn-block">Send</button>
                <p class="signup-terms"
                    style="margin-top: 16px; font-size: 12px; color: var(--text-secondary); text-align: center;">
                    By clicking “Send”, you agree to our Privacy Policy and Public Offering Agreement.
                </p>
            </form>
        </div>
        <div class="signup-image">
            <div class="camera-lens-wrapper">
                <div class="lens-pill">
                    <!-- Placeholder lens image -->
                    <img src="/src/images/image.png" alt="Lens" class="img-placeholder-small">
                </div>
                <div class="camera-main">
                    <!-- Placeholder camera image -->
                    <img src="/src/images/product.png" alt="Camera Product" class="img-placeholder-large">
                </div>
            </div>
        </div>
    </div>
</section>
